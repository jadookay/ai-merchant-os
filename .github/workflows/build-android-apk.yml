name: Build lightweight AIBOS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build optimized release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/release/*.apk
      - name: Upload release APK for tester distribution
        uses: actions/upload-artifact@v4
        with:
          name: AIBOS-Android-Test-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
